name: Release assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed release hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          assert release['form_id']=='43f421c2-dc61-4ea3-b7b5-28d73773af12'
          assert release['publisher']=='quneic'
          for name,digest in release['files'].items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          assert '/api/compute' not in Path('app.js').read_text()
          assert Path('CNAME').read_text().strip()=='app.qune.io'
          PY
